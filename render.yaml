services:
  - type: web
    name: luxxbot
    runtime: docker
    # Dengan HF storage, bisa pakai Free plan — tidak perlu Persistent Disk!
    # Kalau mau lebih stabil, upgrade ke starter ($7/bln).
    plan: free
    region: singapore # Pilihan: singapore, oregon, frankfurt, ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERSIST_DIR
        value: /app/persist
      - key: RADIO_BIND_HOST
        value: 0.0.0.0

      # ─── Hugging Face Storage ─────────────────────────────────────────────
      # Storage session WA & data disimpan di HF → container bisa ephemeral
      # Buat HF access token di: https://huggingface.co/settings/tokens
      # (permission: write ke repo yang kamu buat)
      - key: HF_TOKEN
        sync: false   # ← isi manual di Render dashboard (jangan hardcode!)
      # Format: username/nama-repo  (misal: degraY234/luxxbot-session)
      - key: HF_REPO
        sync: false   # ← isi manual di Render dashboard
      - key: HF_BRANCH
        value: main

      # ─── API Keys ─────────────────────────────────────────────────────────
      - key: GEMINI_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true

    # disk: tidak diperlukan karena session disimpan di Hugging Face!
    # Kalau mau extra safety (fallback), bisa uncomment ini (perlu upgrade ke starter):
    # disk:
    #   name: luxx-persist
    #   mountPath: /app/persist
    #   sizeGB: 1
