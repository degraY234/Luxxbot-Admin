# GitHub Pages Luxxbot-Admin memakai branch main (file di root: index.html, css/, js/).
# Deploy: node scripts/sync-admin-github-pages.mjs
# Workflow ini hanya pengingat — bukan GitHub Actions artifact (environment github-pages belum diset).
name: Deploy Admin Panel (LuxxBot repo)

on:
  workflow_dispatch:

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Petunjuk deploy
        run: |
          echo "GitHub Pages Luxxbot-Admin deploy dari branch main (root), bukan folder admin/."
          echo "Jalankan di PC: node scripts/sync-admin-github-pages.mjs"
          echo "Live: https://degray234.github.io/Luxxbot-Admin/"