<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LuxxBot Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-layer">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div id="login-screen" class="screen login-screen">
    <div class="card login-card">
      <div class="login-logo">🌸</div>
      <h1 class="login-title">L U X X B O T</h1>
      <p class="login-sub">Admin Panel</p>
      <p class="muted login-desc">Khusus owner — kelola bot & radio</p>

      <div class="field">
        <label for="api-base">API Base URL</label>
        <input id="api-base" type="url" placeholder="http://localhost:3920" autocomplete="url" />
        <span class="field-hint">Bukan URL GitHub Pages. Pakai alamat bot (localhost / tunnel).</span>
      </div>

      <div class="field">
        <label for="api-token">Admin Token</label>
        <div class="input-row">
          <input id="api-token" type="password" placeholder="ADMIN_API_TOKEN" autocomplete="current-password" />
          <button type="button" id="btn-toggle-token" class="toggle-eye" aria-label="Tampilkan token">👁</button>
        </div>
      </div>

      <button id="btn-login" class="btn primary">Masuk Dashboard</button>
      <button type="button" id="btn-local" class="btn secondary">⚡ Isi localhost otomatis</button>

      <p id="login-error" class="login-error hidden"></p>
    </div>
  </div>

  <div id="app-screen" class="screen hidden">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="topbar-icon">🌸</span>
        <div>
          <strong>LuxxBot Admin</strong>
          <small class="muted">Control Center</small>
        </div>
        <span id="conn-badge" class="badge offline">offline</span>
      </div>
      <div class="top-actions">
        <button id="btn-refresh" class="btn ghost">↻ Refresh</button>
        <button id="btn-logout" class="btn ghost">Keluar</button>
      </div>
    </header>

    <main class="grid">
      <section class="card span-2 hero-card">
        <div class="hero-inner">
          <div>
            <p class="eyebrow">Live Status</p>
            <h2 id="hero-bot-name">LuxxBot</h2>
            <p id="hero-uptime" class="hero-meta">—</p>
          </div>
          <div id="hero-pill" class="hero-pill">⚡ Online</div>
        </div>
      </section>

      <section class="card span-2">
        <h2>Status Bot</h2>
        <div id="status-grid" class="stat-grid"></div>
      </section>

      <section class="card">
        <h2>Discord</h2>
        <div id="discord-box" class="info-box"></div>
      </section>

      <section class="card">
        <h2>Player</h2>
        <div id="now-box" class="now-playing"></div>
      </section>

      <section class="card span-2">
        <div class="row-between">
          <h2>Antrian Radio</h2>
          <div class="btn-row">
            <button id="btn-skip" class="btn">⏭ Skip</button>
            <button id="btn-clear" class="btn danger">🛑 Clear</button>
            <button id="btn-restart" class="btn warn">🔄 Restart</button>
          </div>
        </div>
        <ul id="queue-list" class="queue-list"></ul>
      </section>
    </main>
    <footer class="footer muted">LuxxBot v3.1 Premium · Made by DoxxBorx</footer>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="js/app.js"></script>
</body>
</html>
